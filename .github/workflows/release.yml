# Релиз на GitHub: после каждого слияния в main, где поменялась готовая
# программа, появляется (или обновляется) релиз с номером версии,
# CursorPad.zip, CursorPad.exe и комплектом QwenPaw. Собирать ничего не нужно:
# берутся файлы из public/, их кладёт туда native/build.sh (выпуск с ПК).
# Выпуск, собранный в GitHub, выкладывает build-release.yml сам.
name: Релиз

on:
  push:
    branches: [main]
    paths: [public/CursorPad.bin, public/CursorPad.zip, public/version.txt, 'public/CursorPad-paw-*.zip', 'public/CursorPad-tools-*.zip', .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверить подпись
        # неподписанный version.txt программа не поставит — такой выпуск не выкладываем
        run: python3 native/update_sign.py --verify public/version.txt
      - name: Выложить релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          ver=$(sed -n '2p' public/version.txt)
          tag="v$ver"
          # «что нового» — первый абзац native/whatsnew.txt, без строки «== версия»
          awk 'NF==0{exit} /^== /{next} {print}' native/whatsnew.txt > notes.md
          printf '\nСкачайте CursorPad.zip (программа и инструкция) или только CursorPad.exe.\nУстанавливать не нужно: распакуйте и запустите CursorPad.exe.\n' >> notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" public/CursorPad.zip public/CursorPad.exe public/CursorPad-paw-*.zip public/CursorPad-tools-*.zip --clobber
            gh release edit "$tag" --notes-file notes.md --latest
          else
            gh release create "$tag" public/CursorPad.zip public/CursorPad.exe public/CursorPad-paw-*.zip public/CursorPad-tools-*.zip \
              --title "CursorPad $ver" --notes-file notes.md --target "$GITHUB_SHA" --latest
          fi
