# Автотесты на каждый push в ветку: проверочная сборка exe тем же MinGW, что на ПК
# (native/build.sh --dev — файлы выпуска не пишутся, public/ не трогается), и тесты,
# которым не нужны Windows, Office или модель QwenPaw. Остальные тесты (*_test.c
# под Win32/COM и test_*.py с --probe/--runtime) здесь не запускаются.
# Выпуск, подпись и релиз — build-release.yml и release.yml, их этот файл не меняет.
name: Проверки

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка
    # не ubuntu-latest: с 19.10.2026 он переезжает на Ubuntu 26, и установка mingw там шла
    # по 30–45 минут (26.10: прогоны 40325356502, 40357991945) — следующий push отменял сборку
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Компилятор MinGW-w64
        run: |
          sudo apt-get update -qq
          sudo apt-get -o Acquire::Retries=3 install -y -qq --no-install-recommends gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
      - name: Проверочная сборка (-Wall -Werror)
        run: sh native/build.sh --dev
      - name: Сборки под флагами (только синтаксис)
        # код под #ifdef иначе никто не компилирует: стенды README (SET_TEST, QWEN_TEST, CVX_LAB,
        # VISUAL_TEST) и AGENT_LAB собирают руками и редко
        working-directory: native
        run: |
          set -eu
          for flag in SET_TEST QWEN_TEST CVX_LAB VISUAL_TEST AGENT_LAB; do
            x86_64-w64-mingw32-gcc -fsyntax-only -O2 -Wall -Werror -Wno-unknown-pragmas -finput-charset=UTF-8 -municode "-D$flag" cursorpad.c
          done

  tests:
    name: Тесты
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13' # как встроенный Python комплекта QwenPaw (3.13.16)
      - name: Зависимости Python-тестов
        # версии — из комплекта QwenPaw (public/CursorPad-paw-*.zip)
        run: python -m pip install 'pillow==13.0.0' 'pypdf==6.21.0' 'jsonschema==4.26.0'
      - name: C-тесты (gcc)
        working-directory: native
        run: |
          set -eu
          for t in search_route_test plm_check_test techno_test soyuz_ops_test store_text_test shahmaty_test norms_test std_test cut_ask_test file_ask_test ai_think_test stamp_name_test avatar_facts_test pk_paste_test; do
            gcc -O2 -Wall -Werror -o "$RUNNER_TEMP/$t" "$t.c" -lm
            "$RUNNER_TEMP/$t"
          done
      - name: Python-тесты
        run: |
          set -eu
          python -I -B native/test_convert_files.py
          python -I -B native/test_norms_check.py
          python -I -B native/make_tables.py --check
          python -I -B native/test_native_arguments.py
          python -I -B native/test_windows_https.py native/agent/windows_https.py
          python -I -B native/test_network_diagnostics.py native/agent/bridge.py --transport-only
