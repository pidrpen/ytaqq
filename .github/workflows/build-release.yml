# Выпуск без ПК: куратор поднимает номер (native/version.h, version.txt,
# whatsnew.txt) и сливает в main. Здесь exe собирается тем же компилятором,
# что на ПК (WinLibs GCC 16.2.0 r1), потом сборка ждёт одобрения владельца:
# окружение release, в нём секрет CURSORPAD_UPDATE_KEY_PEM — ключ подписи.
# После «Approve» version.txt подписывается, public/ уходит в main, выпуск —
# на страницу релизов. Ключ виден только шагу подписи (RELEASE_SIGNING.md).
name: Сборка выпуска

on:
  push:
    branches: [main]
    paths: [native/version.txt]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      build: ${{ steps.ver.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            native/version.txt
            public/version.txt
          sparse-checkout-cone-mode: false
      - id: ver
        run: |
          ver=$(sed -n '2p' native/version.txt)
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          # выпуск с ПК приходит вместе с public/ — тогда собирать нечего
          if [ "$(sed -n '2p' public/version.txt)" = "$ver" ]; then
            echo "::notice::CursorPad $ver уже в public/ — сборка не нужна"
            echo "build=0" >> "$GITHUB_OUTPUT"
          else
            echo "build=1" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == '1'
    runs-on: windows-latest
    env:
      WINLIBS_URL: https://github.com/brechtsanders/winlibs_mingw/releases/download/16.2.0posix-14.0.0-ucrt-r1/winlibs-x86_64-posix-seh-gcc-16.2.0-mingw-w64ucrt-14.0.0-r1.zip
      WINLIBS_SHA256: c1f52294597c0b73786b2a78eb5d176d89226d2f21875eab75e783a8b1cefcc4
    steps:
      # файлы как в репозитории, без замены переводов строк (комплекты сверяются по байтам)
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: C:\winlibs
          key: winlibs-${{ env.WINLIBS_SHA256 }}
      - name: Компилятор
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -fsSL -o /c/winlibs.zip "$WINLIBS_URL"
          echo "$WINLIBS_SHA256  /c/winlibs.zip" | sha256sum -c -
          7z x -y -o'C:\winlibs' 'C:\winlibs.zip' > /dev/null
      - shell: bash
        run: |
          echo 'C:\winlibs\mingw64\bin' >> "$GITHUB_PATH"
      - name: Собрать (без ключа — version.txt не подписан)
        shell: pwsh
        run: |
          gcc --version | Select-Object -First 1
          powershell -NoProfile -File native/build.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $v = (Get-Content public/version.txt -TotalCount 2)[1]
          if ($v -ne '${{ needs.check.outputs.version }}') { throw "собрана $v, а не ${{ needs.check.outputs.version }}" }
      - uses: actions/upload-artifact@v4
        with:
          name: public
          if-no-files-found: error
          retention-days: 7
          path: |
            public/CursorPad.exe
            public/CursorPad.bin
            public/CursorPad.zip
            public/CursorPad.exe.manifest
            public/version.txt
            public/cursors-win/

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      VER: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: public
          path: ${{ runner.temp }}/public
      - name: Подписать
        env:
          CURSORPAD_UPDATE_KEY_PEM: ${{ secrets.CURSORPAD_UPDATE_KEY_PEM }}
        run: |
          test -n "$CURSORPAD_UPDATE_KEY_PEM" || { echo "::error::нет секрета CURSORPAD_UPDATE_KEY_PEM в окружении release (RELEASE_SIGNING.md)"; exit 1; }
          python3 native/update_sign.py --sign "$RUNNER_TEMP/public/version.txt"
          python3 native/update_sign.py --verify "$RUNNER_TEMP/public/version.txt"
      - name: Залить public/ в main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for try in 1 2 3; do
            git fetch --depth=1 origin main
            git checkout -q -B release-push FETCH_HEAD
            cp -R "$RUNNER_TEMP/public/." public/
            git add public
            git commit -q -m "CursorPad $VER: выпуск, собран в GitHub" -m "Сборка ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            if git push origin HEAD:main; then break; fi
            [ "$try" = 3 ] && exit 1
            sleep 5
          done
          echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Выложить релиз
        run: |
          tag="v$VER"
          # «что нового» собранной версии — из её version.txt (после sha256 и подписи)
          tail -n +5 "$RUNNER_TEMP/public/version.txt" | awk 'NF==0{exit} /^== /{next} {print}' > notes.md
          printf '\nСкачайте CursorPad.zip (программа и инструкция) или только CursorPad.exe.\nУстанавливать не нужно: распакуйте и запустите CursorPad.exe.\n' >> notes.md
          assets="public/CursorPad.zip public/CursorPad.exe $(ls public/CursorPad-paw-*.zip public/CursorPad-tools-*.zip)"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" $assets --clobber
            gh release edit "$tag" --notes-file notes.md --latest
          else
            gh release create "$tag" $assets --title "CursorPad $VER" --notes-file notes.md --target "$SHA" --latest
          fi
