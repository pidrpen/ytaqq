; Настройки выгрузки из Союз ПЛМ. Скрипт export.ps1 читает этот файл.

[database]
; Сервер SQL Server с базой Союз ПЛМ, например SERVER\SQLEXPRESS
Server = ЗАПОЛНИТЬ
; Имя базы Союз ПЛМ
Database = ЗАПОЛНИТЬ
; Windows = вход под текущим пользователем Windows, Sql = логин и пароль ниже
Auth = Windows
User =
Password =
; Сколько секунд ждать ответа на один запрос
Timeout = 600

[export]
; Куда класть файлы. Для каждого запуска создаётся подпапка с датой и временем.
OutputDir = C:\SoyuzExport
; Разделитель в CSV (точка с запятой открывается в Excel без настройки)
Delimiter = ;
; Какие запросы выполнять: имена файлов из папки queries через запятую
Queries = materials.sql
